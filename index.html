<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChatGPT</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChatGPT">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
       font-family:-apple-system,system-ui,sans-serif;background:#fff;color:#111}
  img{width:96px;height:96px;border-radius:22px}
  a{padding:12px 24px;border-radius:999px;background:#111;color:#fff;text-decoration:none}
  @media (prefers-color-scheme:dark){body{background:#111;color:#fff}a{background:#fff;color:#111}}
</style>
</head>
<body>
  <img src="icon-192.png" alt="">
  <a id="go" href="https://chatgpt.com/?lightweight_authenticated=1&mweb_fallback=1#">ChatGPT öffnen</a>
<script>
  // Nur weiterleiten, wenn als installierte Web-App gestartet (nicht im Browser)
  var standalone = window.navigator.standalone === true ||
    window.matchMedia("(display-mode: standalone)").matches;
  if (standalone) {
    location.replace("https://chatgpt.com/?lightweight_authenticated=1&mweb_fallback=1#");
  }
</script>
</body>
</html>

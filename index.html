<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Passt du zu unserem Idealstaat?</title>
<style>
:root{color-scheme:light;--ink:#1f1b2e;--muted:#6a6580;--ok:#1fa45b;--mid:#f39c12;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);line-height:1.45;
background:linear-gradient(160deg,#fff4e6 0%,#ffe3f1 35%,#e6f0ff 70%,#e8fff4 100%);background-attachment:fixed;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.hero{background:linear-gradient(120deg,#ff6b6b,#ffa94d,#ffd43b,#51cf66,#339af0,#845ef7);border-radius:20px;padding:22px 20px;color:#fff;margin-bottom:18px;box-shadow:0 8px 24px rgba(132,94,247,.25)}
.hero h1{font-size:1.65rem;margin:0 0 6px;text-shadow:0 2px 6px rgba(0,0,0,.18)}
.hero p{margin:0;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.18)}
.cat{background:#fff;border-radius:18px;padding:0 0 6px;margin-bottom:16px;overflow:hidden;box-shadow:0 4px 16px rgba(31,27,46,.08);border-top:6px solid var(--c)}
.cat h2{font-size:1.05rem;margin:0;padding:12px 16px;background:var(--cl);color:var(--c)}
.q{padding:12px 16px;border-top:1px solid #f0edf5}
.q:first-of-type{border-top:none}
.q label{display:block;font-size:.95rem;margin-bottom:6px;font-weight:500}
.row{display:flex;align-items:center;gap:12px}
.track{position:relative;flex:1;height:30px}
.band{position:absolute;top:10px;height:10px;border-radius:5px;background:var(--cl);outline:2px solid var(--c);display:none}
.show .band{display:block}
input[type=range]{position:relative;width:100%;margin:0;height:30px;background:transparent;accent-color:var(--c)}
.val{min-width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--c);font-variant-numeric:tabular-nums}
.ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-right:50px}
.mark{display:none;font-size:.82rem;margin-top:4px;font-weight:600}
.show .mark{display:block}
.in{color:var(--ok)}.out{color:var(--bad)}
button{font:inherit;border:0;border-radius:14px;padding:14px 18px;cursor:pointer}
.primary{background:linear-gradient(120deg,#ff6b6b,#cc5de8,#339af0);color:#fff;width:100%;font-weight:700;font-size:1.05rem;box-shadow:0 6px 18px rgba(204,93,232,.35)}
.ghost{background:#fff;color:var(--muted);border:2px solid #e3dff0;margin-top:12px;width:100%;font-weight:600}
#result{display:none;background:#fff;border-radius:20px;padding:20px;margin-top:18px;box-shadow:0 6px 22px rgba(31,27,46,.1)}
.verdict{font-size:1.5rem;font-weight:800;margin:0 0 4px}
.score{color:var(--muted);margin:0 0 14px}
.bar{height:14px;border-radius:7px;background:#eee9f5;overflow:hidden;margin-bottom:18px}
.bar div{height:100%;border-radius:7px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 4px;border-top:1px solid #f0edf5;vertical-align:top}
th{color:var(--muted);font-weight:600;border-top:none}
td.c{text-align:center;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:800;color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<h1>Passt du zu unserem Idealstaat?</h1>
<p>Bewerte jede Aussage von 1 (gar nicht wichtig) bis 10 (extrem wichtig) – ehrlich nach deinem Charakter.</p>
</div>
<div id="form"></div>
<button class="primary" id="go">Auswerten ✨</button>
<div id="result"></div>
</div>
<script>
const DATA=[
 {cat:"1 · Macht und Mitbestimmung",c:"#e8590c",cl:"#fff0e3",qs:[
  {t:"Wie wichtig ist dir, dass Gesetze gemeinsam von allen beschlossen werden?",r:[7,10]},
  {t:"Wie wichtig ist dir, dass über Gesetzesbrüche gemeinsam diskutiert wird?",r:[6,9]}]},
 {cat:"2 · Freiheit und Grenzen",c:"#d6336c",cl:"#ffe8f0",qs:[
  {t:"Wie wichtig sind dir grundlegender Respekt und Toleranz gegenüber allen?",r:[7,10]},
  {t:"Wie viel Freiheit soll jeder haben – solange er niemandem schadet?",r:[6,9]}]},
 {cat:"3 · Gerechtigkeit und Vermögen",c:"#7048e8",cl:"#efeaff",qs:[
  {t:"Wie wichtig ist dir, dass man sich bei Bedarf gegenseitig hilft?",r:[7,10]},
  {t:"Wie sehr soll große Leistung besser belohnt werden?",r:[6,9]}]},
 {cat:"4 · Bildung und Chancen",c:"#1c7ed6",cl:"#e5f2ff",qs:[
  {t:"Wie wichtig ist dir freier Zugang zu Bildung für alle?",r:[8,10]},
  {t:"Wie fair findest du, dass alle Zahlungsfähigen Bildung mitfinanzieren?",r:[6,9]}]},
 {cat:"5 · Solidarität und Dienste",c:"#0ca678",cl:"#e3fbf1",qs:[
  {t:"Wie wichtig ist dir, Menschen in Armut auf dem Weg in Arbeit zu begleiten?",r:[7,10]},
  {t:"Wie wichtig ist dir, dass Kranke gut gepflegt werden?",r:[8,10]}]},
 {cat:"6 · Generationengerechtigkeit",c:"#e67700",cl:"#fff6d6",qs:[
  {t:"Wie wichtig ist dir, den Jungen eine bessere Zukunft zu schaffen als man selbst hatte?",r:[7,10]},
  {t:"Wie sehr sollen Chancen für Jüngere garantiert werden?",r:[7,10]}]}
];
const form=document.getElementById('form');let all=[];
DATA.forEach((c,ci)=>{
 const box=document.createElement('section');box.className='cat';
 box.style.setProperty('--c',c.c);box.style.setProperty('--cl',c.cl);
 box.innerHTML='<h2>'+c.cat+'</h2>';
 c.qs.forEach((q,qi)=>{
  const id='q'+ci+'_'+qi;
  const left=((q.r[0]-1)/9*100),w=((q.r[1]-q.r[0])/9*100);
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`<label for="${id}">${q.t}</label>
  <div class="row"><div class="track"><div class="band" style="left:${left}%;width:${w}%"></div>
  <input type="range" id="${id}" min="1" max="10" step="1" value="5"></div><span class="val" id="${id}v">5</span></div>
  <div class="ends"><span>1</span><span>10</span></div>
  <div class="mark" id="${id}m"></div>`;
  box.appendChild(d);
  all.push({c,q,id});
 });
 form.appendChild(box);
});
all.forEach(a=>{const el=document.getElementById(a.id);el.addEventListener('input',()=>{document.getElementById(a.id+'v').textContent=el.value;if(document.body.classList.contains('show'))evaluate();});});
function fit(v,r){if(v>=r[0]&&v<=r[1])return 1;const d=v<r[0]?r[0]-v:v-r[1];return Math.max(0,1-d/3);}
function col(p){return p>=80?'var(--ok)':p>=55?'var(--mid)':'var(--bad)';}
function evaluate(){
 let sum=0,inC=0,rows='';
 all.forEach(a=>{
  const v=+document.getElementById(a.id).value,r=a.q.r,f=fit(v,r),ok=f===1;
  sum+=f;if(ok)inC++;
  const m=document.getElementById(a.id+'m');
  m.className='mark '+(ok?'in':'out');
  m.textContent=(ok?'✓ In der Staats-Range ':'✗ Außerhalb der Staats-Range ')+'('+r[0]+'–'+r[1]+')';
  rows+=`<tr><td><span class="dot" style="background:${a.c.c}"></span>${a.q.t}</td><td class="c">${r[0]}–${r[1]}</td><td class="c"><b>${v}</b></td><td class="c ${ok?'in':'out'}">${ok?'✓':'✗'}</td></tr>`;
 });
 const pct=Math.round(sum/all.length*100);
 const label=pct>=80?'Passt sehr gut zu dir 🎉':pct>=55?'Passt ganz gut zu dir 👍':'Passt schlecht zu dir 🤔';
 const catRows=DATA.map(c=>{const items=all.filter(a=>a.c===c);const s=Math.round(items.reduce((x,a)=>x+fit(+document.getElementById(a.id).value,a.q.r),0)/items.length*100);
  return `<tr><td><span class="dot" style="background:${c.c}"></span>${c.cat}</td><td class="c"><span class="pill" style="background:${col(s)}">${s} %</span></td></tr>`}).join('');
 const res=document.getElementById('result');
 res.style.display='block';
 res.innerHTML=`<p class="verdict" style="color:${col(pct)}">${label}</p>
 <p class="score">Übereinstimmung: <b>${pct} %</b> · ${inC} von ${all.length} Antworten in der Staats-Range</p>
 <div class="bar"><div style="width:${pct}%;background:${col(pct)}"></div></div>
 <table><tr><th>Bereich</th><th class="c">Passung</th></tr>${catRows}</table>
 <br><table><tr><th>Aussage</th><th class="c">Staat</th><th class="c">Du</th><th></th></tr>${rows}</table>
 <button class="ghost" id="reset">Neu starten</button>`;
 document.getElementById('reset').onclick=()=>{all.forEach(a=>{document.getElementById(a.id).value=5;document.getElementById(a.id+'v').textContent=5;});document.body.classList.remove('show');res.style.display='none';window.scrollTo({top:0,behavior:'smooth'});};
}
document.getElementById('go').onclick=()=>{document.body.classList.add('show');evaluate();document.getElementById('result').scrollIntoView({behavior:'smooth'});};
</script>
</body>
</html>
